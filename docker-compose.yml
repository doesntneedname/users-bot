services:
  web:
    build: .
    container_name: employee-service
    ports:
      - "3002:3002"
    env_file: .env
    environment:
      - NODE_ENV=production
      - STATE_PATH=/data/state.json
    volumes:
      - users-bot-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  users-bot-data:
